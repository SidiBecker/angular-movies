<div class="wrapper">

    @if (yearsWithMultipleWinners.length > 0) {

    <div class="card">
        <span class="title">List years with multiple winners</span>

        <table>
            <thead>
                <tr>
                    <th>Year</th>
                    <th>Win Count</th>
                </tr>
            </thead>
            <tbody>

                @for (yearObject of yearsWithMultipleWinners; track yearObject.year) {
                <tr>
                    <td>{{yearObject.year}}</td>
                    <td>{{yearObject.winnerCount}}</td>
                </tr>
                } @empty {
                <tr>
                    <span>No movies were found</span>
                </tr>
                }


            </tbody>
        </table>
    </div>
    }

</div>
